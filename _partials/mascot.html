<div class="detective" data-detective>
  <p class="detective__bubble" role="status" aria-live="polite"></p>
  <button type="button" class="detective__btn" aria-label="Yeast detective: back to the top">
    <span class="detective__fig">
      <img class="detective__std" src="{{P}}img/shell/detective.png" width="120" height="110" alt="" />
      <img class="detective__alt" src="{{P}}img/shell/detective-torch.png" width="120" height="110" alt="" />
      <svg class="detective__torch" viewBox="-40 -40 80 80" aria-hidden="true" focusable="false">
        <defs>
          <linearGradient id="dt-body" x1="0" y1="-6" x2="0" y2="6" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#6f5a86"/><stop offset=".32" stop-color="#e4d6f2"/><stop offset=".56" stop-color="#8f78ad"/><stop offset="1" stop-color="#2b1d3a"/></linearGradient>
          <linearGradient id="dt-head" x1="0" y1="-11" x2="0" y2="11" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#7e0c6e"/><stop offset=".34" stop-color="#e59ad4"/><stop offset=".6" stop-color="#9c2a8a"/><stop offset="1" stop-color="#3d0636"/></linearGradient>
          <radialGradient id="dt-fist" cx="-.2" cy="-.35" r="1.1"><stop offset="0" stop-color="#fff0cf"/><stop offset=".6" stop-color="#fcd49c"/><stop offset="1" stop-color="#eaa55c"/></radialGradient>
        </defs>
        <g data-torch-rot>
          <rect x="-4" y="-5.5" width="32" height="11" rx="3" fill="url(#dt-body)"/>
          <g fill="rgba(0,0,0,.28)"><rect x="12" y="-5.5" width="1.6" height="11"/><rect x="16" y="-5.5" width="1.6" height="11"/><rect x="20" y="-5.5" width="1.6" height="11"/></g>
          <path d="M26 -6.5 L37 -11 L37 11 L26 6.5 Z" fill="url(#dt-head)"/>
          <ellipse cx="37.4" cy="0" rx="2.4" ry="10.2" fill="#fffdf2"/>
          <circle data-torch-tip cx="38" cy="0" r=".6" fill="none"/>
          <path d="M-7 -6.5C-7 -10.5 -2 -12 3 -11.5C8 -11 10.5 -8.5 10.5 -4.5V5C10.5 9.5 7 11.5 2 11.5C-3.5 11.5 -7.5 9 -7.5 4Z" fill="url(#dt-fist)" stroke="#e39b52" stroke-width=".9"/>
          <path d="M2.5 -11V-5.5M6.5 -10.5V-5.5M-1.5 -10.8V-5.8" stroke="#dc9048" stroke-width=".9" stroke-linecap="round" fill="none"/>
          <path d="M-5 -4.5C-1 -3 4 -3 9 -4.4" stroke="#e8a45e" stroke-width=".8" fill="none" stroke-linecap="round"/>
        </g>
      </svg>
    </span>
  </button>
</div>
