<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>交互图形演示</title><style>*{box-sizing:border-box}body{margin:0;padding:28px;background:#f6f2fa;color:#30243d;font:16px/1.6 system-ui}h1{font-size:26px}label{display:block;margin:16px 0}input{width:min(100%,400px)}button{padding:10px 20px;background:#6e4fb8;color:white;border:0;border-radius:10px}svg{width:100%;height:220px;background:white;border-radius:16px}small{color:#756880}</style><h1>形状如何随参数变化？</h1><p>拖动参数，观察振幅与频率。此页只是交互演示，不是科研模型。</p><label>振幅 <output id="av">40</output><br><input id="a" type="range" min="5" max="80" value="40"></label><label>频率 <output id="fv">3</output><br><input id="f" type="range" min="1" max="8" value="3"></label><svg viewBox="0 0 700 220" role="img" aria-label="参数曲线"><path d="M0 110H700" stroke="#ddd"/><path id="curve" fill="none" stroke="#6e4fb8" stroke-width="4"/></svg><button id="reset">恢复默认</button> <small>HTML + CSS + JavaScript · 可独立阅读</small><script>const a=document.querySelector('#a'),f=document.querySelector('#f');function draw(){document.querySelector('#av').textContent=a.value;document.querySelector('#fv').textContent=f.value;document.querySelector('#curve').setAttribute('d',Array.from({length:351},(_,i)=>`${i?'L':'M'}${i*2} ${110-Number(a.value)*Math.sin(i/350*Math.PI*2*Number(f.value))}`).join(' '));}a.oninput=f.oninput=draw;document.querySelector('#reset').onclick=()=>{a.value=40;f.value=3;draw()};draw();</script></html>
