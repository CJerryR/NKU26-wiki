<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>NemaKlear embed example</title>
<style>body{margin:0}#nemaklear-model{display:block;width:100%;height:1500px;border:0}</style>
<!-- Copy the iframe and script into your Wiki component. For deployment, replace
     the local URL with your model service's HTTPS origin, retaining /?embed=1. -->
<iframe id="nemaklear-model" src="http://127.0.0.1:8765/?embed=1" title="NemaKlear model explorer"></iframe>
<script>
(() => {
 const frame=document.getElementById('nemaklear-model');
 const origin=new URL(frame.src).origin;
 function init(){frame.contentWindow.postMessage({type:'nemaklear:init'},origin);}
 frame.addEventListener('load',init);
 window.addEventListener('message',event=>{
  if(event.source!==frame.contentWindow || event.origin!==origin || event.data?.type!=='nemaklear:height')return;
  const h=event.data.height;
  if(typeof h==='number' && Number.isFinite(h) && h>=100 && h<=30000)frame.style.height=Math.max(600,h)+'px';
 });
 init();
})();
</script></html>
