<section class="sg lab lab--figure" id="signal" data-nav-label="Dry lab and wet lab" data-signal data-tone="light" aria-labelledby="signal-title">
  <div class="wrap lab__inner">
    <div class="lab__head">
      <h2 class="h-display" id="signal-title" data-split>Our work: dry lab and wet lab</h2>
      <p>The wet lab builds a yeast that turns an ascaroside signal into color. The dry lab screens its receptor and turns that color into nematode numbers and advice.</p>
    </div>
    <figure class="lab__fig">
      <picture>
        <source srcset="{{P}}img/home/lab-overview.webp" type="image/webp" />
        <img src="{{P}}img/home/lab-overview.png" width="1489" height="812" loading="lazy" decoding="async"
          alt="How the wet lab and dry lab fit together. Arthrobotrys oligospora, a nematode-trapping fungus, captures nematodes around it, and from it we found a receptor that recognises ascarosides. Dry lab: we modified this receptor and used molecular docking and molecular dynamics to screen variants that recognise ascr#3 and ascr#18. Wet lab: the modified gene is put into yeast, which then expresses the receptor; its signal is coupled to the yeast's own pathway and switches on betaxanthin synthesis, so the pigment builds up and the medium changes color. Measuring the medium by OD and RGB gives pigment concentration. Dry lab: a lumped model relates pigment concentration to ascaroside concentration, and so to nematode activity, written as N nematode = f(OD, t, ...) = f'(color). The eco model takes the estimated abundance of harmful nematodes, estimates its economic impact and suggests what to do." />
      </picture>
    </figure>
  </div>
</section>
