# Build from locked source dependencies. Stage releases permit empty page bodies; technical checks still gate deployment.
image: node:22

variables:
  ASTRO_TELEMETRY_DISABLED: "1"
  npm_config_cache: "$CI_PROJECT_DIR/.npm"

.wiki-build:
  stage: build
  cache:
    key:
      prefix: author-source-clean-20261018
      files:
        - package-lock.json
    paths:
      - .npm/
  before_script:
    - df -h .
    - du -sh .npm 2>/dev/null || true
    - command -v python3 >/dev/null || (apt-get update -qq && apt-get install -y -qq python3 >/dev/null)
    - npm ci --no-audit --no-fund
  script:
    - npm run test:deployment
    - npm run build
    - npm run audit
  artifacts:
    paths:
      - public
    expire_in: 7 days

pages:
  extends: .wiki-build
  rules:
    # iGEM's official template states that runners only run on main.
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
