# Build from locked source dependencies. Only reviewed main-branch builds deploy.
image: node:22

variables:
  ASTRO_TELEMETRY_DISABLED: "1"
  npm_config_cache: "$CI_PROJECT_DIR/.npm"

.wiki-build:
  stage: build
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - .npm/
  before_script:
    - command -v python3 >/dev/null || (apt-get update -qq && apt-get install -y -qq python3 >/dev/null)
    - npm ci --no-audit --no-fund
  script:
    - npm run build
    - npm run audit
  artifacts:
    paths:
      - public
    expire_in: 7 days

pages:
  extends: .wiki-build
  script:
    - npm run build
    - npm run audit:publication
  rules:
    # iGEM's official template states that runners only run on main.
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
