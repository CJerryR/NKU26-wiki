<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="vendor/pdf/web/pdf_viewer.css"><link rel="stylesheet" href="viewer.css"><title>PDF 阅读器</title><style>
body{height:100dvh;display:flex;flex-direction:column;overflow:hidden}#workspace{position:relative;flex:1;min-height:0;display:flex}#viewerContainer{position:absolute;inset:0;overflow:auto;background:#dedbd5}#thumbs{width:150px;overflow:auto;background:#e9e4db;flex-shrink:0;padding:8px}#thumbs[hidden]{display:none}#workspace:has(#thumbs:not([hidden])) #viewerContainer{left:150px}#thumbs button{display:block;width:100%;margin-bottom:10px}#thumbs canvas{max-width:100%;height:auto}#page{width:65px}#search{width:135px}#matches{font-size:12px}.pdfViewer .page{margin:12px auto}#status{flex-shrink:0}@media(max-width:600px){#thumbs{width:100px}#workspace:has(#thumbs:not([hidden])) #viewerContainer{left:100px}}
</style></head><body>
<header><strong id="title">PDF 阅读器</strong><button id="thumbnails" aria-expanded="false">缩略图</button><button id="prev" aria-label="上一页">‹</button><input id="page" type="number" min="1" value="1" aria-label="页码"><span id="count">/ —</span><button id="next" aria-label="下一页">›</button><button id="out" aria-label="缩小">−</button><button id="fit">适应宽度</button><button id="in" aria-label="放大">＋</button><button id="rotate">旋转</button><input id="search" placeholder="搜索文档" aria-label="搜索文档"><button id="find">查找下一个</button><span id="matches" role="status"></span><button id="fullscreen">全屏</button><a id="download" class="action" download>下载</a><a id="print" class="action" target="_blank" rel="noopener">打开 / 打印</a></header>
<p id="status" role="status">正在加载 PDF…</p><div id="error" role="alert"></div><div id="workspace"><aside id="thumbs" hidden aria-label="页面缩略图"></aside><div id="viewerContainer" tabindex="0"><div id="viewer" class="pdfViewer"></div></div></div>
<script type="module" src="pdf.js"></script></body></html>
