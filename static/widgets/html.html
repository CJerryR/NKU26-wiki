<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="viewer.css"><title>HTML document</title></head><body><header><strong id="title">HTML document</strong><button id="reload">Reload</button><button id="fullscreen">Fullscreen</button></header><p id="status" role="status"></p><div id="error" role="alert"></div><div class="stage"><iframe id="document" title="HTML document content" sandbox="" referrerpolicy="no-referrer"></iframe></div><script>const labels=new Map([['交互演示 · 可在窗口内操作','Interactive demo · controls are available within the frame'],['文档阅读 · 脚本关闭','Document view · scripts are disabled'],['此浏览器不支持嵌入窗口全屏。','Fullscreen is unavailable in this browser.']]);const localize=()=>{for(const node of document.querySelectorAll('#status,#error')){const text=node.textContent.trim();if(labels.has(text))node.textContent=labels.get(text)}};new MutationObserver(localize).observe(document.body,{subtree:true,childList:true,characterData:true});localize();</script><script type="module" src="html.js"></script></body></html>
